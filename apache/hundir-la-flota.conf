# ====================================================================
# CONFIGURACIÓN DE APACHE 2.4 - HUNDIR LA FLOTA ONLINE (PROXY INVERSO)
# ====================================================================
#
# Requisitos de módulos de Apache (habilitar antes de activar este sitio):
#   sudo a2enmod proxy
#   sudo a2enmod proxy_http
#   sudo a2enmod proxy_wstunnel
#   sudo a2enmod rewrite
#   sudo a2enmod headers
#   sudo a2enmod ssl
#
# Sustituye 'midominio.com' por tu dominio o subdominio real.
# ====================================================================

# --------------------------------------------------------------------
# 1. BLOQUE HTTP (Puerto 80): Redirección automática a HTTPS
# --------------------------------------------------------------------
<VirtualHost *:80>
    ServerName midominio.com
    ServerAlias www.midominio.com
    ServerAdmin admin@midominio.com

    # Redireccionar todo el tráfico HTTP hacia HTTPS de forma segura
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    ErrorLog ${APACHE_LOG_DIR}/hundir_flota_error.log
    CustomLog ${APACHE_LOG_DIR}/hundir_flota_access.log combined
</VirtualHost>

# --------------------------------------------------------------------
# 2. BLOQUE HTTPS (Puerto 443): Proxy Inverso Seguro con WebSockets
# --------------------------------------------------------------------
<VirtualHost *:443>
    ServerName midominio.com
    ServerAlias www.midominio.com
    ServerAdmin admin@midominio.com

    # Configuración de Certificados SSL (Let's Encrypt / Certbot)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/midominio.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/midominio.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Cabeceras de seguridad
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Motor de reescritura para actualización de WebSockets
    RewriteEngine On

    # Si la petición entrante solicita actualización a WebSocket (Socket.IO)
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:3005/$1" [P,L]

    # Configuración del Proxy Inverso
    ProxyPreserveHost On
    ProxyRequests Off

    # Paso de cabeceras para identificar la IP real del cliente
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Soporte específico de Socket.IO por WebSocket
    ProxyPass /socket.io/ ws://127.0.0.1:3005/socket.io/
    ProxyPassReverse /socket.io/ ws://127.0.0.1:3005/socket.io/

    # Paso general de la aplicación web Node.js
    ProxyPass / http://127.0.0.1:3005/
    ProxyPassReverse / http://127.0.0.1:3005/

    # Tiempos de espera para conexiones persistentes en tiempo real
    ProxyTimeout 600

    # Logs de eventos y accesos
    ErrorLog ${APACHE_LOG_DIR}/hundir_flota_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/hundir_flota_ssl_access.log combined
</VirtualHost>
